<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THROW — Display</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #oc,#oc2d,#ov{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  #oc2d{display:none}
  #ov{pointer-events:none}
  body.live{cursor:none}
  body.live #hud{display:none}
  #hud{
    position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:16px;
    justify-content:center;padding:16px;z-index:9;
    background:linear-gradient(transparent,rgba(0,0,0,.8));
  }
  #badge{color:#ffb020;font:12px ui-monospace,monospace;letter-spacing:.14em}
  #tip{color:rgba(255,255,255,.5);font:11px ui-monospace,monospace}
  #status{font:11px ui-monospace,monospace;color:#c4ff2e;max-width:46ch}
  #status.warn{color:#ffb020}
  #meter{font:11px ui-monospace,monospace;color:rgba(255,255,255,.45);white-space:nowrap}
  #meter.warn{color:#ffb020}
  #fsbtn{
    padding:10px 24px;border-radius:6px;border:1px solid #8ab320;background:rgba(196,255,46,.12);
    color:#c4ff2e;font:13px ui-monospace,monospace;letter-spacing:.1em;cursor:pointer;
  }
  #fsbtn:hover{background:rgba(196,255,46,.25)}
  #banner{
    display:none;position:fixed;top:0;left:0;right:0;z-index:99;
    background:#2a0d14;border-bottom:1px solid #ff3b6b;color:#ffd9e2;
    font:12px ui-monospace,monospace;padding:8px 12px;
  }
  #waiting{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;color:#454d56;font:13px ui-monospace,monospace;
    letter-spacing:.1em;pointer-events:none;
  }
  #waiting.hidden{display:none}
</style>
</head>
<body>
<canvas id="oc"></canvas>
<canvas id="oc2d"></canvas>
<canvas id="ov"></canvas>
<div id="banner"></div>
<div id="waiting"><b style="color:#c4ff2e;font-size:16px">THROW DISPLAY</b><span>waiting for the editor tab…</span><span style="font-size:10px">keep the editor tab open — everything you edit there projects here live</span></div>
<div id="hud">
  <span id="badge">⧉ DISPLAY</span>
  <span id="tip">drag this tab's window onto the projector, then fullscreen — edits sync live from the editor</span>
  <span id="status"></span>
  <span id="meter"></span>
  <button id="fsbtn">⛶ FULLSCREEN</button>
</div>

<script src="shared.js"></script>
<script src="display-storage.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
//  THROW display tab — a pure renderer.
//  Geometry arrives over BroadcastChannel; media arrives as Blobs and
//  is decoded/played LOCALLY. This tab owns its own <video> elements,
//  so it keeps playing no matter what happens to the editor window
//  (Chrome suspends media in occluded windows — the bug that killed
//  the old canvas-push design).
// ══════════════════════════════════════════════════════════════════

const oc   = document.getElementById('oc');    // WebGL canvas (primary renderer)
const oc2d = document.getElementById('oc2d');  // Canvas2D fallback (unsupported blends / no WebGL)
const ov   = document.getElementById('ov');    // 2D overlay: placeholders + outlines
const g2   = oc2d.getContext('2d');
const og   = ov.getContext('2d');
let stageW = 1920, stageH = 1080;
let surfaceList = [];            // ordered geometry from the editor
let showOutlines = false;   // see 00-state.js — off until asked for
const mediaMap = new Map();      // surfId -> {store:Map(itemId->item), order, cfg, cur, nxt, ...}
const incoming = new Map();      // itemId -> {surfId, xfer, name, mime, size, got, backend}
                                 // (transfer in flight; bytes live in DiskStore)
// Session ids of OTHER display tabs that answered the roll-call. Declared here,
// ahead of the message handler that fills it — the same declaration-after-use
// trap that broke the editor split (NOTES §13).
const _aliveSessions = new Set();

// TWO ceilings, and they are not interchangeable. Items under DiskStore.SMALL
// stay in memory whatever the disk situation, so they are bounded by MEM_BUDGET
// no matter how much quota exists. Folding both into one number meant forty
// 50MB clips were checked against an 8GB disk budget and never warned at all —
// the exact failure this reporting exists to surface.
let MEM_BUDGET = 2.5 * 1024 * 1024 * 1024;     // measured in-memory blob ceiling
                                               // (settable below purely so a test
                                               // can trip it without allocating 2.5GB)
const QUOTA_RESERVE = 0.20;                    // leave a fifth of the quota unused
let _diskBudget = 0;                 // 0 = disk unavailable
let _quota = 0, _quotaUsage = 0, _diskOK = false;
let _heldBytes = 0;                  // MEMORY-backed bytes only
const GB = (n) => (n / 1073741824).toFixed(1) + ' GB';
const MB = (n) => Math.round(n / 1048576) + ' MB';
const SZ = (n) => n >= 1073741824 ? GB(n) : MB(n);

async function refreshBudget(){
  _diskOK = await DiskStore.probe();
  const e = await DiskStore.estimate();
  _quota = (e && e.quota) || 0;
  _quotaUsage = (e && e.usage) || 0;
  _diskBudget = (_diskOK && _quota) ? _quota * (1 - QUOTA_RESERVE) : 0;
}

// videos live in a tiny visible holder — invisible media gets suspended
const holder = document.createElement('div');
holder.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;overflow:hidden;opacity:.02;pointer-events:none;z-index:0';
document.body.appendChild(holder);

function banner(msg, detail){
  const b = document.getElementById('banner');
  b.textContent = '⚠ THROW: ' + msg + (detail ? ' (' + detail + ')' : '');
  b.style.display = 'block';
  try{ bc.postMessage({type:'display-error', msg, detail}); }catch(_){}
}
function clearBanner(){ document.getElementById('banner').style.display = 'none'; }

// The editor has had these since the start; this page did not, so an async
// failure anywhere in the media path disappeared silently and the projection
// just stopped with no explanation. Nothing fails silently (NOTES §4).
window.addEventListener('error', e=>{
  banner('Something went wrong in the display: '+(e.message||'unknown error'),
         e.filename ? ('line '+e.lineno) : '');
});
window.addEventListener('unhandledrejection', e=>{
  const r=e.reason;
  banner('A background task failed in the display: '+((r&&r.message)||String(r)));
});

// ── Media handling (playlists; local to this tab) ─────────────────
// Per surface: a STORE of items (content-addressed by itemId — blobs arrive
// once) plus an ORDER + transition config that ride the state broadcast.
// The scheduler plays order[cur], advances on video 'ended' or an image
// timer, and hands over via cut / crossfade / fade-to-black.
// Mark an item present: it is no longer a gap to be pulled. Called wherever an
// item actually lands in the store.
function itemArrived(M, itemId){
  if(M._missing) M._missing.delete(itemId);
  if(M._asked) M._asked.delete(itemId);
}

function ensureM(surfId){
  let M = mediaMap.get(surfId);
  if(!M){
    M = {store:new Map(), order:[], adjust:new Map(), crop:new Map(), trim:new Map(), cfg:{transition:'cut', xfDur:1, imgDur:8},
         cur:null, nxt:null, xfStart:0, curStart:0, _cued:false};
    mediaMap.set(surfId, M);
  }
  return M;
}
function disposeItem(item){
  _heldBytes -= (item && item.bytes) || 0;
  if(_heldBytes < 0) _heldBytes = 0;
  // A disk-backed clip owns a real FILE; dropping the element is not enough.
  // Release by filename, never by itemId: during a re-transfer the id already
  // points at the INCOMING file, so releasing by id here deleted the new
  // backing store at the instant the new item was stored.
  if(item && item.disk && item.fileName) DiskStore.releaseFile(item.fileName);
  try{ if(item.el && item.el.pause) item.el.pause(); }catch(_){}
  try{ if(item.el && item.el.parentNode) item.el.remove(); }catch(_){}
  try{ if(item.el && item.el._stop) item.el._stop(); }catch(_){}
  try{ if(item.url) URL.revokeObjectURL(item.url); }catch(_){}
  try{ if(item.tex && gl) gl.deleteTexture(item.tex); }catch(_){}
  item.tex=null;
}
function clearMedia(surfId){
  // The GL buffer is freed FIRST and unconditionally: a surface that never had
  // media has no mediaMap entry but may well have a mesh (drawGL builds one per
  // surface), and returning early on `!M` leaked it for the whole session.
  try{ const msh=glMesh.get(surfId); if(msh && gl) gl.deleteBuffer(msh.vbo); glMesh.delete(surfId); }catch(_){}
  const M = mediaMap.get(surfId);
  if(!M) return;
  for(const item of M.store.values()) disposeItem(item);
  mediaMap.delete(surfId);
}

async function addItemBlob(surfId, itemId, name, blob, backend, fileName){
  const blob0 = blob;   // kept so the error handler can reason about its size
  const bytes0 = (blob0 && blob0.size) || 0;
  const disk = backend === 'opfs';
  const M = ensureM(surfId);
  // Only MEMORY-backed bytes count against the blob ceiling. A disk-backed
  // clip costs storage quota instead, which is the whole point of putting it
  // there — counting it here would re-impose the limit OPFS just removed.
  // NOTE the increment must not happen before the early returns below, or an
  // item that never reaches the store leaks its bytes into the total forever.
  const charge = () => { if(!disk) _heldBytes += bytes0; };
  const old = M.store.get(itemId);
  if(old) disposeItem(old);
  const file = new File([blob], name || 'media', {type: blob.type});
  const video = isVideoFile(file);

  if(!video && ANIMATED_EXT.test(name||'')){
    try{
      const anim = await createAnimatedCanvas(file);
      // M was captured before this await. If the surface was deleted while the
      // decode ran, clearMedia already dropped it from mediaMap — storing into
      // that stale M would strand a self-advancing canvas holding its decoded
      // frames for the life of the tab. Same if a newer blob for this id
      // arrived meanwhile and already populated the store.
      if(anim && mediaMap.get(surfId)!==M){
        try{ if(anim.canvas && anim.canvas._stop) anim.canvas._stop(); }catch(_){}
        return;
      }
      if(anim){ charge(); M.store.set(itemId, {kind:'anim', el:anim.canvas, url:null, name, bytes:disk?0:bytes0, disk, itemId, fileName}); itemArrived(M, itemId); return; }
    }catch(err){ banner(err.message); }
    // fall through to plain <img> (browser still animates GIF/WebP natively)
  }

  const url = typedBlobURL(file, video);
  if(video){
    sniffVideoCodec(file).then(info=>{   // advisory only, never blocks
      if(info.name && !info.ok) banner((name||'video')+' looks like '+info.name+' — trying anyway; if it fails, see the hint that follows');
    }).catch(()=>{});
    const el = document.createElement('video');
    el.muted = true; el.playsInline = true; el.preload = 'auto';
    el.setAttribute('muted',''); el.setAttribute('playsinline','');
    el.loop = true;   // syncPl sets the real value (single item = loop)
    let retried = false;
    el.addEventListener('error', ()=>{
      const code = el.error ? el.error.code : 0;
      if(!retried){                       // one clean reload before blaming the file
        retried = true;
        try{ el.removeAttribute('src'); el.load(); }catch(_){}
        setTimeout(()=>{ try{ el.src=url; el.load(); if(isActive(surfId,itemId)) el.play().catch(()=>{}); }catch(_){} }, 70);
        return;
      }
      // A big clip failing with "unsupported source" is almost never the
      // codec: it is the blob store refusing to serve bytes it cannot hold.
      // Saying "re-encode, it is probably HEVC" there sends the user chasing
      // the wrong problem entirely.
      if((code===3 || code===4) && !disk && _heldBytes > MEM_BUDGET*0.7){
        banner('Couldn’t play “'+(name||'that clip')+'” — this tab is holding '+GB(_heldBytes)+' of video, past what the browser will serve',
               'this is a size limit, not a codec problem — select your largest clips in the editor and use ⤓ Downscale to 1080p, then reload this tab');
      } else {
        banner('Couldn’t play '+(name||'that video')+' — '+mediaErrText(code)+'.', playbackHint(name, code));
      }
    });
    el.addEventListener('loadeddata', ()=>{ clearBanner(); if(isActive(surfId,itemId)) el.play().catch(()=>{}); });
    el.addEventListener('ended', ()=>{
      const m=mediaMap.get(surfId);
      if(m && m.cur===itemId && !m.nxt) advanceSurf(m);
    });
    holder.appendChild(el);
    el.src = url;
    charge();
    M.store.set(itemId, {kind:'video', el, url, name, bytes:disk?0:bytes0, disk, itemId, fileName});
    itemArrived(M, itemId);
  } else {
    const el = new Image();
    el.addEventListener('error', ()=>banner('Couldn’t load '+(name||'that image')+'.','the file may be corrupt or an unsupported format'));
    el.src = url;
    charge();
    M.store.set(itemId, {kind:'image', el, url, name, bytes:disk?0:bytes0, disk, itemId, fileName});
    itemArrived(M, itemId);
  }
  syncPlayback(M);
}
function addItemSrc(surfId, itemId, src, name){   // data: URLs from a restored project
  if(typeof src !== 'string' || !src.startsWith('data:image/')) return;
  const M = ensureM(surfId);
  const old = M.store.get(itemId);
  if(old) disposeItem(old);
  const el = new Image();
  el.src = src;
  // data: URLs are held in memory like any blob, so they count too — this
  // was previously invisible to the running total.
  const approx = Math.floor((src.length - (src.indexOf(',')+1)) * 0.75);
  _heldBytes += approx;
  M.store.set(itemId, {kind:'image', el, url:null, name:name||'restored image', bytes:approx, disk:false, itemId});
  itemArrived(M, itemId);
  syncPlayback(M);
}

function isActive(surfId, itemId){
  const M=mediaMap.get(surfId);
  return !!M && (M.cur===itemId || M.nxt===itemId);
}

// Apply order + config from the state broadcast.
function syncPl(surfId, pl){
  const M = ensureM(surfId);
  M.cfg = {transition:pl.transition||'cut', xfDur:pl.xfDur||1, imgDur:pl.imgDur||8};
  const list = Array.isArray(pl.items) ? pl.items : [];
  M.order = list.map(it=>it.id);
  M.adjust = new Map(list.map(it=>[it.id, it.adjust||{}]));   // each item's own look
  M.crop = new Map(list.map(it=>[it.id, it.crop||null]));     // and its own crop
  M.trim = new Map(list.map(it=>[it.id, {in:+it.trimIn||0, out:+it.trimOut||0}]));  // in/out seconds (out 0 = end)
  // prune items removed from the playlist
  for(const id of [...M.store.keys()]) if(!M.order.includes(id)){ disposeItem(M.store.get(id)); M.store.delete(id); }
  if(M.nxt && !M.order.includes(M.nxt)){ M.nxt=null; }
  if(M.cur && !M.order.includes(M.cur)){ M.cur=null; }
  // NOTE what the order references but this tab doesn't hold — but do NOT ask
  // for it here. The editor starts an async arrayBuffer read and the (tiny)
  // state message overtakes it, so a just-dropped clip is legitimately absent
  // for as long as the read takes — ~100ms for 80MB. Asking on sight re-sent
  // every clip twice. needSweep() below asks only once the grace period is up.
  if(!M._missing) M._missing=new Map();
  if(!M._asked) M._asked=new Set();
  const nowT=performance.now();
  for(const id of M.order) if(!M.store.has(id) && !incoming.has(id) && !M._missing.has(id)) M._missing.set(id, nowT);
  for(const id of [...M._missing.keys()]){
    // An item whose bytes are arriving right now is not missing — a multi-GB
    // clip takes far longer than the grace period to ship.
    if(M.store.has(id) || incoming.has(id) || !M.order.includes(id)){ M._missing.delete(id); M._asked.delete(id); }
  }
  syncPlayback(M);
}
// Make reality match intent: cur points at a valid item, only active videos
// play, single-item videos loop natively (no 'ended' churn).
// A trim window makes an item start at trimIn and end at trimOut (0 = end).
function trimOf(M, id){ const t=M.trim.get(id)||{}; return {in:Math.max(0,t.in||0), out:Math.max(0,t.out||0)}; }
function hasTrim(M, id){ const t=trimOf(M,id); return t.in>0 || t.out>0; }
function seekTrimIn(M, id){
  const it=M.store.get(id); if(!it || it.kind!=='video') return;
  const t=trimOf(M,id);
  try{ if(t.in>0 && Math.abs(it.el.currentTime-t.in)>0.05) it.el.currentTime=t.in; }catch(_){}
}

function syncPlayback(M){
  if(!M.cur && M.order.length){ M.cur=M.order[0]; M._cued=false; }
  const now=performance.now();
  for(const [id,item] of M.store){
    if(item.kind!=='video') continue;
    // native loop only when a lone clip has no trim window; trimmed clips loop
    // manually within [trimIn, trimOut] via tickPlaylists
    item.el.loop = (M.order.length===1) && !hasTrim(M, id);
    const active = (id===M.cur || id===M.nxt);
    if(active){
      if(item.el.paused) item.el.play().catch(()=>{});
    } else {
      if(!item.el.paused){ try{ item.el.pause(); item.el.currentTime=0; }catch(_){} }
    }
  }
  if(!M.curStart) M.curStart=now;
}

function advanceSurf(M){
  if(!M || M.order.length<2 || M.nxt) return;
  const i=Math.max(0, M.order.indexOf(M.cur));
  const nid=M.order[(i+1)%M.order.length];
  if(M.cfg.transition==='cut'){
    const old=M.store.get(M.cur);
    M.cur=nid; M.curStart=performance.now(); M._cued=false;
    if(old && old.kind==='video'){ try{ old.el.pause(); old.el.currentTime=0; }catch(_){} }
    syncPlayback(M);
  } else {
    M.nxt=nid; M.xfStart=performance.now();
    syncPlayback(M);   // starts the incoming video during the fade
    seekTrimIn(M, nid);   // incoming clip fades in from ITS trimIn
  }
}
function finishTransition(M){
  const old=M.store.get(M.cur);
  M.cur=M.nxt; M.nxt=null; M.curStart=performance.now(); M._cued=false;
  if(old && old.kind==='video'){ try{ old.el.pause(); old.el.currentTime=0; }catch(_){} }
}

// What to draw for a surface right now: one pass, or two during a crossfade.
// mul scales the surface's own opacity.
function surfacePasses(M, now){
  if(M.nxt){
    const k=Math.min(1, (now-M.xfStart)/(Math.max(0.05,M.cfg.xfDur)*1000));
    if(k>=1) finishTransition(M);
    else if(M.cfg.transition==='crossfade') return [{id:M.cur,mul:1-k},{id:M.nxt,mul:k}];
    else return (k<0.5) ? [{id:M.cur,mul:1-2*k}] : [{id:M.nxt,mul:2*k-1}];   // fade to black
  }
  return M.cur ? [{id:M.cur,mul:1}] : [];
}
// Per-frame scheduler: cue videos to their trimIn, loop/advance at trimOut,
// and advance image items on their timer. (The coarse 1.5s watchdog can't do
// trim — it would overshoot the out-point by up to a frame-and-a-half.)
function tickPlaylists(now){
  for(const M of mediaMap.values()){
    if(!M.cur || M.nxt) continue;   // mid-crossfade: leave both clips rolling
    const it=M.store.get(M.cur);
    if(!it) continue;
    if(it.kind==='video'){
      const el=it.el;
      const t=trimOf(M, M.cur);
      if(!M._cued && el.readyState>=1){ seekTrimIn(M, M.cur); M._cued=true; }
      if(el.readyState>=2 && el.duration){
        const tout=(t.out>t.in) ? Math.min(t.out, el.duration) : el.duration;
        if(el.currentTime >= tout-0.02){
          if(M.order.length>=2) advanceSurf(M);                                  // next clip
          else { try{ el.currentTime=t.in; el.play().catch(()=>{}); }catch(_){} } // loop the window
        }
      }
    } else if(M.order.length>=2 && now-M.curStart > M.cfg.imgDur*1000){
      advanceSurf(M);
    }
  }
}

// raw=true returns the bare element (GL path: texImage2D uploads it once per
// frame — NOT the per-triangle sampling that stalls Chrome's decoder).
// raw=false (Canvas2D fallback) stages video frames into a canvas first.
// Once a video has shown ANY frame, hold the last good one through loop/seek
// readyState dips instead of flashing the placeholder ('hold' sentinel).
function itemEl(item, raw){
  if(!item) return null;
  const el = item.el;
  if(item.kind==='video'){
    const ready = el.readyState>=2 && el.videoWidth>0;
    if(ready) item._hadFrame = true;
    if(raw) return ready ? el : (item._hadFrame ? 'hold' : null);
    if(!ready) return (item._hadFrame && item.stage) ? item.stage : null;
    if(!item.stage){ item.stage=document.createElement('canvas'); item.stageCtx=item.stage.getContext('2d'); }
    if(item.stage.width!==el.videoWidth || item.stage.height!==el.videoHeight){
      item.stage.width=el.videoWidth; item.stage.height=el.videoHeight;
    }
    try{ item.stageCtx.drawImage(el,0,0); }catch(_){ return null; }
    return item.stage;
  }
  if(item.kind==='anim')  return el;
  return (el.complete && el.naturalWidth>0) ? el : null;
}

// Pull anything the playlist still references after the grace period. This is
// the recovery path for a blob the display pruned (an undo brought the item
// back) or a message that was genuinely lost — NOT the normal load path, which
// the editor pushes. The grace period must comfortably outlast a large file's
// arrayBuffer read or every dropped clip crosses the channel twice.
const NEED_GRACE_MS = 2500;
function needSweep(){
  const nowT=performance.now();
  for(const [surfId,M] of mediaMap){
    if(!M._missing || !M._missing.size) continue;
    // The sweep owns this bookkeeping: syncPl only runs when the state snapshot
    // actually changes, so it stops once the scene settles.
    for(const id of [...M._missing.keys()]){
      if(M.store.has(id) || incoming.has(id) || !M.order.includes(id)) itemArrived(M, id);
    }
    for(const [id,since] of M._missing){
      if(nowT-since < NEED_GRACE_MS || M._asked.has(id)) continue;
      M._asked.add(id);   // one request per gap; hello-display covers a hard resync
      try{ bc.postMessage({type:'need-item', surfId, itemId:id}); }catch(_){}
    }
  }
}

// ── Status and self-help ──────────────────────────────────────────
// This tab is a passive renderer, so every upstream problem looks the same
// from here: a checkerboard, or a still frame. That is indistinguishable from
// "nothing has been set up yet", which leaves the user staring at a wall with
// no idea whose fault it is. Say which it is, and name the one remedy that
// always works — reloading rebuilds every media element from scratch and the
// editor repopulates it automatically via the hello handshake.
let _health = '', _healthFor = 0;

function updateHud(){
  const st = document.getElementById('status');
  if(!st) return;
  if(incoming.size){
    let got=0, total=0, name='';
    for(const inc of incoming.values()){ got+=inc.got; total+=inc.size||0; name=inc.name||name; }
    const pct = total ? Math.floor(got/total*100) : 0;
    st.className = '';
    st.textContent = 'receiving ' + (incoming.size>1 ? incoming.size+' clips' : '“'+name+'”') + ' — ' + pct + '%';
    return;
  }
  st.className = _health ? 'warn' : '';
  st.textContent = _health;
  paintMeter();
}

// What this tab is holding, and against what. Deliberately separate from
// #status: that line is for problems, this one is always-on context.
function paintMeter(){
  const m = document.getElementById('meter');
  if(!m) return;
  let clips = 0, videos = 0;
  for(const M of mediaMap.values()){
    clips += M.store.size;
    for(const it of M.store.values()) if(it.kind==='video') videos++;
  }
  if(!clips && !incoming.size){ m.textContent = ''; m.className = ''; return; }
  // Report the two ceilings separately. Adding memory bytes to whole-origin
  // disk usage produced a number that meant nothing in either unit.
  const parts = [clips + ' clip' + (clips===1?'':'s') + (videos>1 ? ' ('+videos+' video)' : '')];
  if(_diskOK && _diskBudget) parts.push(SZ(_quotaUsage) + ' on disk of ' + GB(_diskBudget));
  if(_heldBytes)             parts.push(SZ(_heldBytes) + ' in memory of ' + GB(MEM_BUDGET));
  if(!_diskOK)               parts.push('memory only — no disk storage here');
  const near = _heldBytes > MEM_BUDGET * 0.7 ||
               (_diskBudget && _quotaUsage > _diskBudget * 0.85);
  m.className = near ? 'warn' : '';
  m.textContent = parts.join(' · ');
}

function healthCheck(){
  let missing=0, stuck=0;
  for(const M of mediaMap.values()){
    if(!M.order.length) continue;
    for(const iid of M.order) if(!M.store.has(iid) && !incoming.has(iid)) missing++;
    const cur = M.cur && M.store.get(M.cur);
    if(cur && cur.kind==='video' && cur.el && !cur.el.ended && cur.el.readyState>=2 && cur.el.paused) stuck++;
  }
  const prev=_health;
  if(incoming.size)   _health='';                       // a transfer is in progress; not stuck
  else if(missing)    _health='waiting for '+missing+' clip'+(missing>1?'s':'')+' from the editor — if this stays, reload this tab (Ctrl+R)';
  else if(stuck)      _health=stuck+' clip'+(stuck>1?'s':'')+' not advancing — reload this tab (Ctrl+R) to rebuild playback';
  else                _health='';
  _healthFor = (_health && _health===prev) ? _healthFor+1 : 0;
  // The HUD is hidden in fullscreen, so a problem that persists has to reach
  // the banner instead — that is the only surface the user can see on the wall.
  if(_health && _healthFor===8) banner(_health);
  if(!_health && prev) clearBanner();
  updateHud();
}

// Watchdog: re-kick paused ACTIVE videos, and detect DECODE STALLS — a video
// "playing" with frozen currentTime (several high-res streams exceeding the
// GPU decode budget). A tiny re-seek restarts the pipeline; if it keeps
// stalling, say the honest reason.
setInterval(()=>{
  needSweep();
  healthCheck();
  for(const M of mediaMap.values()){
    for(const [id,item] of M.store){
      if(item.kind!=='video') continue;
      if(!(id===M.cur || id===M.nxt)) continue;   // inactive items are paused by design
      const el=item.el;
      if(el.paused && !el.ended && el.readyState>=2){ el.play().catch(()=>{}); continue; }
      if(!el.paused && el.readyState>=2){
        if(item._lastT===el.currentTime){
          item._stall=(item._stall||0)+1;
          if(item._stall===2 || item._stall===4){
            try{ el.currentTime=Math.max(0, el.currentTime-0.001); }catch(_){}
            el.play().catch(()=>{});
          } else if(item._stall===6){
            banner((item.name||'a clip')+' keeps stalling — this machine is likely at its hardware video-decode limit. Several high-res clips at once? Re-encode them to 1080p (the projector can’t show more anyway). If it stays frozen, reload this tab (Ctrl+R).');
          }
        } else {
          item._stall=0;
        }
        item._lastT=el.currentTime;
      }
    }
  }
}, 1500);

// ── Sync (BroadcastChannel; same origin over localhost) ──────────
const bc = new BroadcastChannel('throw-sync');
let gotState = false;
bc.onmessage = (ev)=>{
  const d = ev.data || {};
  if(d.type==='state'){
    const st = JSON.parse(d.json);
    stageW = st.stageW; stageH = st.stageH;
    showOutlines = st.outlines;
    surfaceList = st.surfaces;
    // Stamp each surface's geometry key ONCE per state message. drawGL used to
    // recompute JSON.stringify(s.pts) per surface EVERY FRAME just to decide
    // whether to rebuild the VBO — in the tab whose whole job is holding 60fps
    // with several 4K streams. Geometry only ever changes via this message, so
    // computing it here is both exact and ~60x cheaper. (Keyed on pts alone, so
    // an opacity or blend change still reuses the existing mesh.)
    for(const s of surfaceList) s._geoKey = s.rows+'x'+s.cols+'|'+JSON.stringify(s.pts);
    // drop media for surfaces that no longer exist; sync playlists for the rest
    const ids = new Set(surfaceList.map(s=>s.id));
    for(const id of [...mediaMap.keys()]) if(!ids.has(id)) clearMedia(id);
    for(const s of surfaceList) if(s.pl) syncPl(s.id, s.pl);
    if(!gotState){ gotState=true; document.getElementById('waiting').classList.add('hidden'); }
  }
  // Chunked transfer (see 10-sync.js). Parts are collected and only turned
  // into a Blob at pl-end — a Blob assembled this way can be backed by disk,
  // unlike the single giant ArrayBuffer this replaced, and it is still fully
  // materialised in THIS tab, which is what NOTES §2 required.
  else if(d.type==='pl-begin'){
    incoming.set(d.itemId, {surfId:d.surfId, xfer:d.xfer, name:d.name, mime:d.mime||'',
                            size:d.size||0, got:0, backend:'?'});
    // Large clips stream to disk (OPFS); small ones stay in memory. begin() is
    // async, but write() queues internally, so chunks arriving before it
    // resolves are still ordered correctly.
    DiskStore.begin(d.itemId, {name:d.name, mime:d.mime, size:d.size})
      .then(backend=>{ const i=incoming.get(d.itemId); if(i) i.backend=backend; })
      .catch(()=>{});
    updateHud();
  }
  else if(d.type==='pl-chunk'){
    const inc=incoming.get(d.itemId);
    // Only chunks belonging to the transfer that opened this entry. Two
    // overlapping transfers of the same clip used to append into one buffer,
    // producing a payload LARGER than the file and an undecodable "codec" error.
    if(inc && inc.xfer===d.xfer){ DiskStore.write(d.itemId, d.buf); inc.got+=(d.buf&&d.buf.byteLength)||0; updateHud(); }
  }
  else if(d.type==='pl-end'){
    const inc=incoming.get(d.itemId);
    if(inc && inc.xfer===d.xfer){
      incoming.delete(d.itemId);
      DiskStore.finish(d.itemId).then(res=>{
        if(!res) return;
        // Trust the declared size: a short or long reassembly means something
        // went wrong upstream, and corrupt media is worse than none.
        if(inc.size && res.size!==inc.size){
          console.error('[THROW] size mismatch', {declared:inc.size, got:res.size, backend:res.backend});
          DiskStore.release(d.itemId);
          banner('“'+(inc.name||'a clip')+'” arrived incomplete ('+res.size+' of '+inc.size+' bytes) — it will be requested again');
          return;
        }
        if(res.backend==='blob' && _heldBytes + res.size > MEM_BUDGET){
          banner('This tab is holding '+GB(_heldBytes+res.size)+' of video in memory — past about '+GB(MEM_BUDGET)+' the browser stops serving clips for playback',
                 'clips under '+MB(DiskStore.SMALL)+' are kept in memory, so a lot of small ones add up; ⤓ Downscale the big ones');
        }
        // RETURNED, so the .catch below actually covers it. Left dangling, an
        // addItemBlob rejection escaped the chain entirely and — with no
        // unhandledrejection handler on this page — vanished without trace,
        // taking the retry-in-memory recovery with it.
        return addItemBlob(inc.surfId, d.itemId, inc.name, res.file, res.backend, res.name);
      }).catch(err=>{
        console.error('[THROW] store failed', err && (err.name+': '+err.message));
        // Do NOT give up on the clip. Mark disk unusable for it and release the
        // partial file; the missing-item sweep re-requests it and the retry
        // goes to memory, which either works or fails with an honest message.
        DiskStore.markNoDisk(d.itemId);
        DiskStore.release(d.itemId);
        const quota = err && err.name === 'QuotaExceededError';
        banner(quota ? '“'+(inc.name||'a clip')+'” did not fit in this browser’s storage — retrying in memory'
                     : 'Couldn’t store “'+(inc.name||'a clip')+'” for playback',
               quota ? 'private/incognito windows get a much smaller allowance; a normal window has far more room'
                     : (err && err.message));
      }).then(updateHud);
      updateHud();
    }
  }
  else if(d.type==='pl-abort'){
    const inc=incoming.get(d.itemId);
    if(inc && (d.xfer===undefined || inc.xfer===d.xfer)){
      incoming.delete(d.itemId);
      DiskStore.release(d.itemId);
    }
    updateHud();
  }
  else if(d.type==='pl-src')  addItemSrc(d.surfId, d.itemId, d.src, d.name);
  // Roll-call between display tabs. Answering is unconditional and cheap; a
  // tab that does not answer is one that is not running, and only then is its
  // storage reclaimed.
  else if(d.type==='display-alive?'){
    if(d.from && d.from!==DiskStore.session) _aliveSessions.add(d.from);
    try{ bc.postMessage({type:'display-alive', from: DiskStore.session}); }catch(_){}
  }
  else if(d.type==='display-alive'){
    if(d.from && d.from!==DiskStore.session) _aliveSessions.add(d.from);
  }
  else if(d.type==='hello-editor'){
    // The editor (re)loaded after this tab was already open. It missed our
    // one-shot greeting below, so answer its roll-call: without this the
    // editor's ⧉ Display button never lights up and it never force-sends
    // media to a display it doesn't know is listening.
    try{ bc.postMessage({type:'hello-display'}); }catch(_){}
  }
  else if(d.type==='editor-bye'){ /* editor closed; keep last frame */ }
};
// Reclaim OPFS files left by a crashed or force-closed session (their owning
// itemIds are gone, so nothing else will ever free them), then size the budget
// from the real quota before any media arrives.
// Reclaiming storage from a crashed session is necessary — nothing else will
// ever free it. But a LIVE second display tab's storage looks exactly the same
// from here, and the previous version deleted it: opening a second tab wiped
// the media the first one was projecting, mid-show. OPFS is per-ORIGIN, not
// per-tab, so "clean up everything that isn't mine" is simply wrong.
//
// Instead, ask. Every display tab answers a roll-call with its session id over
// the channel that already exists, so a directory is only reclaimed when
// nobody speaks for it. A crashed session cannot answer; a live one always
// will. The wait is generous because being slow here costs nothing, while
// being wrong deletes someone's show.
setTimeout(()=>{
  DiskStore.purgeStale(_aliveSessions)
    .then(n=>{ if(n) console.info('[THROW] reclaimed '+n+' media folder(s) from ended session(s)'); })
    .then(refreshBudget)
    .then(paintMeter)
    .catch(()=>{});
}, 900);
try{ bc.postMessage({type:'display-alive?', from: DiskStore.session}); }catch(_){}

// Best-effort tidy on a clean close. Never fires on a crash, which is exactly
// when it would matter — hence the roll-call above being the real reclaim.
//
// persisted:true means the page is going into the back/forward cache and can
// come BACK, with all of its JavaScript state intact — including a mediaMap
// full of items pointing at files. Deleting them there would restore a tab
// that believes it still has media it no longer has, and the projection would
// break with nothing to explain it. Only tidy up on an actual teardown.
window.addEventListener('pagehide', (e)=>{
  if(e.persisted) return;
  try{ DiskStore.purgeSelf(); }catch(_){}
});

refreshBudget().then(paintMeter).catch(()=>{});
setInterval(()=>{ refreshBudget().then(paintMeter).catch(()=>{}); }, 15000);

// announce ourselves — the editor answers with full state + media
bc.postMessage({type:'hello-display'});

// ── Fullscreen ────────────────────────────────────────────────────
// Fullscreen FIRST, then calibrate from the editor: because edits sync live
// into this already-fullscreen tab, the mapping never shifts after alignment.
// (The old "calibrate windowed, then fullscreen" flow moved everything —
// letterbox offsets change with window size. This flow removes the problem.)
function goFullscreen(){
  const de = document.documentElement;
  if(de.requestFullscreen) de.requestFullscreen().catch(()=>{});
}
document.getElementById('fsbtn').addEventListener('click', goFullscreen);
document.addEventListener('dblclick', goFullscreen);
document.addEventListener('fullscreenchange', ()=>{
  document.body.classList.toggle('live', !!document.fullscreenElement);
  fit();
});
document.addEventListener('keydown', e=>{
  if(e.key==='f'||e.key==='F') goFullscreen();
  if(e.key==='o'||e.key==='O') showOutlines=!showOutlines; // local override until next state msg
});

// ── WebGL renderer ─────────────────────────────────────────────────
// Canvas2D warping (72 clipped drawImage calls per surface per frame) is why
// three clips used to lag. The GPU does this workload natively: upload the
// video frame as a texture ONCE, draw the whole warped mesh in one call.
// Normal/Screen/Multiply/Add composite via blendFunc (+ shader tricks for
// opacity); Overlay/Hard-Light/Color-Dodge aren't expressible with blendFunc,
// so any surface using those drops the whole frame to the Canvas2D fallback.
let gl=null, glLoc=null;
const glMesh = new Map();   // surfId -> {vbo, count, key}   (textures live on playlist items)
const GL_OK_BLENDS = new Set(['normal','screen','multiply','add']);

let glMask=null;
function initGL(){
  try{
    gl = oc.getContext('webgl', {alpha:false, antialias:false, stencil:true});
    if(!gl) return false;
    const vs =
      'attribute vec2 a_pos; attribute vec2 a_uv; varying vec2 v_uv;'+
      'uniform vec3 u_fit; uniform vec2 u_view;'+                 // fit: scale,ox,oy (stage→device px)
      'uniform vec2 u_flip;'+                                     // 0 or 1 per axis
      'uniform vec4 u_crop;'+                                     // x,y,w,h source sub-rect
      'void main(){'+
      '  vec2 px = a_pos*u_fit.x + u_fit.yz;'+
      '  gl_Position = vec4(px.x/u_view.x*2.0-1.0, 1.0-px.y/u_view.y*2.0, 0.0, 1.0);'+
      // flip within [0,1] (abs(0-uv)=uv, abs(1-uv)=1-uv), then map into the crop
      // rect — both per-item uniforms, so one mesh still serves every item
      '  v_uv = u_crop.xy + abs(u_flip - a_uv) * u_crop.zw;'+
      '}';
    const fs =
      'precision mediump float; varying vec2 v_uv;'+
      'uniform sampler2D u_tex; uniform float u_opacity; uniform int u_mode;'+
      'uniform vec4 u_adjust;'+   // brightness, contrast, saturation, hue (radians)
      'void main(){'+
      '  vec4 c = texture2D(u_tex, v_uv);'+
      '  vec3 rgb = c.rgb * u_adjust.x;'+                          // brightness
      '  rgb = (rgb - 0.5) * u_adjust.y + 0.5;'+                   // contrast
      '  float lum = dot(rgb, vec3(0.2126,0.7152,0.0722));'+
      '  rgb = mix(vec3(lum), rgb, u_adjust.z);'+                  // saturation
      '  if(u_adjust.w != 0.0){'+                                  // hue: rotate about the grey axis
      '    const vec3 k = vec3(0.57735);'+
      '    float cs = cos(u_adjust.w), sn = sin(u_adjust.w);'+
      '    rgb = rgb*cs + cross(k,rgb)*sn + k*dot(k,rgb)*(1.0-cs);'+
      '  }'+
      '  rgb = clamp(rgb, 0.0, 1.0);'+
      '  float a = c.a * u_opacity;'+
      '  if(u_mode==3){ gl_FragColor = vec4(mix(vec3(1.0), rgb, a), 1.0); }'+  // multiply: dst scales by this
      '  else { gl_FragColor = vec4(rgb*a, a); }'+                             // premultiplied alpha
      '}';
    const sh=(type,src)=>{
      const x=gl.createShader(type); gl.shaderSource(x,src); gl.compileShader(x);
      if(!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x));
      return x;
    };
    const prog=gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    glLoc={
      pos:gl.getAttribLocation(prog,'a_pos'), uv:gl.getAttribLocation(prog,'a_uv'),
      fit:gl.getUniformLocation(prog,'u_fit'), view:gl.getUniformLocation(prog,'u_view'),
      op:gl.getUniformLocation(prog,'u_opacity'), mode:gl.getUniformLocation(prog,'u_mode'),
      adjust:gl.getUniformLocation(prog,'u_adjust'), flip:gl.getUniformLocation(prog,'u_flip'),
      crop:gl.getUniformLocation(prog,'u_crop'),
    };
    // ── mask program: position-only, used to stamp sticker shapes into the
    //    stencil buffer (colour writes are masked off while it runs) ──
    const mvs='attribute vec2 a_pos; uniform vec3 u_fit; uniform vec2 u_view;'+
      'void main(){ vec2 px=a_pos*u_fit.x+u_fit.yz;'+
      '  gl_Position=vec4(px.x/u_view.x*2.0-1.0, 1.0-px.y/u_view.y*2.0, 0.0, 1.0); }';
    const mfs='precision mediump float; void main(){ gl_FragColor=vec4(1.0); }';
    const mprog=gl.createProgram();
    gl.attachShader(mprog, sh(gl.VERTEX_SHADER, mvs));
    gl.attachShader(mprog, sh(gl.FRAGMENT_SHADER, mfs));
    gl.linkProgram(mprog);
    if(!gl.getProgramParameter(mprog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(mprog));
    glMask={ prog:mprog, vbo:gl.createBuffer(),
      pos:gl.getAttribLocation(mprog,'a_pos'),
      fit:gl.getUniformLocation(mprog,'u_fit'), view:gl.getUniformLocation(mprog,'u_view') };
    glMask.mainProg=prog;

    gl.enable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    return true;
  }catch(_){ gl=null; return false; }
}
const hasGL = initGL();

// Stencil-stamp a surface's sticker mask, then set the test so subsequent draws
// only land inside it. Returns true if a mask was applied (caller must reset).
function applyMaskStencil(s, sc, ox, oy){
  const mp = s.mask && maskStagePts(s);
  if(!mp) return false;
  const tris = earClip(mp);
  if(tris.length<6) return false;
  gl.enable(gl.STENCIL_TEST);
  gl.clearStencil(0);
  gl.clear(gl.STENCIL_BUFFER_BIT);
  gl.colorMask(false,false,false,false);
  gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
  gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
  gl.useProgram(glMask.prog);
  gl.uniform3f(glMask.fit, sc, ox, oy);
  gl.uniform2f(glMask.view, oc.width, oc.height);
  gl.bindBuffer(gl.ARRAY_BUFFER, glMask.vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tris), gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(glMask.pos);
  gl.vertexAttribPointer(glMask.pos, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, tris.length/2);
  // back to the media program, drawing only where stencil==1
  gl.colorMask(true,true,true,true);
  gl.stencilFunc(gl.EQUAL, 1, 0xFF);
  gl.stencilOp(gl.KEEP, gl.KEEP, gl.KEEP);
  gl.useProgram(glMask.mainProg);
  return true;
}

// Tessellate the bilinear mesh for the GPU. Subdivision is fixed and generous
// (verts are nearly free in GL) so dense warps stay smooth.
function buildMesh(s){
  const sub=8, verts=[];
  for(let r=0;r<s.rows;r++) for(let c=0;c<s.cols;c++){
    const tl=s.pts[r][c], tr=s.pts[r][c+1], bl=s.pts[r+1][c], br=s.pts[r+1][c+1];
    const u0=c/s.cols,u1=(c+1)/s.cols, v0=r/s.rows,v1=(r+1)/s.rows;
    for(let si=0;si<sub;si++) for(let sj=0;sj<sub;sj++){
      const ua=sj/sub,ub=(sj+1)/sub, va=si/sub,vb=(si+1)/sub;
      const p00=biquad(tl,tr,bl,br,ua,va), p10=biquad(tl,tr,bl,br,ub,va);
      const p01=biquad(tl,tr,bl,br,ua,vb), p11=biquad(tl,tr,bl,br,ub,vb);
      // flips are a shader uniform now, so one mesh serves every item
      const U=(u)=>u0+u*(u1-u0);
      const V=(v)=>v0+v*(v1-v0);
      verts.push(
        p00.x,p00.y,U(ua),V(va),  p10.x,p10.y,U(ub),V(va),  p11.x,p11.y,U(ub),V(vb),
        p00.x,p00.y,U(ua),V(va),  p11.x,p11.y,U(ub),V(vb),  p01.x,p01.y,U(ua),V(vb)
      );
    }
  }
  return new Float32Array(verts);
}

function drawGL(){
  const W=oc.width, H=oc.height;
  gl.viewport(0,0,W,H);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if(!(stageW && stageH && surfaceList.length)) return;
  const sc=Math.min(W/stageW, H/stageH);
  const ox=(W-stageW*sc)/2, oy=(H-stageH*sc)/2;
  gl.enable(gl.SCISSOR_TEST);   // clip to the stage rect, like the 2D path
  gl.scissor(Math.round(ox), Math.round(H-oy-stageH*sc), Math.round(stageW*sc), Math.round(stageH*sc));
  gl.useProgram(glMask.mainProg);
  gl.uniform3f(glLoc.fit, sc, ox, oy);
  gl.uniform2f(glLoc.view, W, H);
  gl.disable(gl.STENCIL_TEST);

  const now=performance.now();
  for(const s of surfaceList){
    if(s.visible===false) continue;
    const M = mediaMap.get(s.id);
    if(!M) continue;

    // build the mesh once (shared by all passes)
    const key=s._geoKey || (s.rows+'x'+s.cols+'|'+JSON.stringify(s.pts));
    let msh=glMesh.get(s.id);
    if(!msh){ msh={vbo:gl.createBuffer(), count:0, key:null}; glMesh.set(s.id,msh); }
    if(msh.key!==key){
      gl.bindBuffer(gl.ARRAY_BUFFER, msh.vbo);
      const v=buildMesh(s);
      gl.bufferData(gl.ARRAY_BUFFER, v, gl.DYNAMIC_DRAW);
      msh.count=v.length/4; msh.key=key;
    }

    // sticker mask → stencil (switches programs internally, so bind the mesh
    // attribs AFTER); unmasked surfaces run with the stencil test off
    const masked = applyMaskStencil(s, sc, ox, oy);
    if(!masked) gl.disable(gl.STENCIL_TEST);

    gl.bindBuffer(gl.ARRAY_BUFFER, msh.vbo);
    gl.enableVertexAttribArray(glLoc.pos);
    gl.enableVertexAttribArray(glLoc.uv);
    gl.vertexAttribPointer(glLoc.pos, 2, gl.FLOAT, false, 16, 0);
    gl.vertexAttribPointer(glLoc.uv,  2, gl.FLOAT, false, 16, 8);

    // one pass normally; two overlapping passes during a crossfade
    for(const pass of surfacePasses(M, now)){
      const item = M.store.get(pass.id);
      if(!item) continue;
      const el = itemEl(item, true);
      if(!el) continue;                       // overlay draws the placeholder
      if(el==='hold' && !item.tex) continue;  // dip before any upload — nothing to hold

      if(!item.tex){ item.tex=gl.createTexture(); item.uploadedKey=null; }
      gl.bindTexture(gl.TEXTURE_2D, item.tex);
      const staticKey = (item.kind==='image') ? item.el.src : null;   // video/anim re-upload every frame
      if(el!=='hold' && (staticKey===null || item.uploadedKey!==staticKey)){
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        try{ gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el); }
        catch(_){ continue; }
        item.uploadedKey=staticKey;
      }

      const blend=s.blend||'normal';
      const op=((typeof s.opacity==='number')?s.opacity:1)*pass.mul;
      gl.uniform1f(glLoc.op, op);
      const adj=M.adjust.get(pass.id)||{};   // this ITEM's look, not the surface's
      gl.uniform4f(glLoc.adjust,
        (typeof adj.br==='number')?adj.br:1,
        (typeof adj.ct==='number')?adj.ct:1,
        (typeof adj.sat==='number')?adj.sat:1,
        (adj.hue||0)*Math.PI/180);
      gl.uniform2f(glLoc.flip, adj.flipH?1:0, adj.flipV?1:0);
      const cr=cropRect(M.crop.get(pass.id));   // this ITEM's crop
      gl.uniform4f(glLoc.crop, cr.x, cr.y, cr.w, cr.h);
      if(blend==='add'){           gl.uniform1i(glLoc.mode,1); gl.blendFunc(gl.ONE, gl.ONE); }
      else if(blend==='screen'){   gl.uniform1i(glLoc.mode,2); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR); }
      else if(blend==='multiply'){ gl.uniform1i(glLoc.mode,3); gl.blendFunc(gl.DST_COLOR, gl.ZERO); }
      else {                       gl.uniform1i(glLoc.mode,0); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); }
      gl.drawArrays(gl.TRIANGLES, 0, msh.count);
    }
  }
}

// ── Canvas2D fallback (no WebGL, or exotic blend modes in use) ────
function draw2D(){
  const W=oc2d.width, H=oc2d.height;
  g2.setTransform(1,0,0,1,0,0);
  g2.imageSmoothingEnabled=true;
  g2.imageSmoothingQuality='high';
  g2.fillStyle='#000';
  g2.fillRect(0,0,W,H);
  if(!(stageW && stageH && surfaceList.length)) return;
  const sc=Math.min(W/stageW, H/stageH);
  const ox=(W-stageW*sc)/2, oy=(H-stageH*sc)/2;
  g2.save();
  try{
    g2.translate(ox,oy); g2.scale(sc,sc);
    g2.beginPath(); g2.rect(0,0,stageW,stageH); g2.clip();
    const now=performance.now();
    for(const s of surfaceList){
      if(s.visible===false) continue;
      const M=mediaMap.get(s.id);
      if(!M) continue;
      try{
        for(const pass of surfacePasses(M, now)){
          const item=M.store.get(pass.id);
          const el=itemEl(item, false);   // staged: per-triangle video sampling stalls the decoder
          if(!el) continue;
          const op=((typeof s.opacity==='number')?s.opacity:1)*pass.mul;
          renderSurfaceTo(g2, {...s, opacity:op}, el, stageW, stageH, M.adjust.get(pass.id)||{}, M.crop.get(pass.id));
        }
      }catch(err){ banner('A surface failed to render and was skipped', err.message); }
    }
  } finally { g2.restore(); }
}

// ── Overlay: calibration placeholders + outlines (always Canvas2D) ─
function drawOverlay(){
  og.setTransform(1,0,0,1,0,0);
  og.clearRect(0,0,ov.width,ov.height);
  if(!(stageW && stageH && surfaceList.length)) return;
  const sc=Math.min(ov.width/stageW, ov.height/stageH);
  const ox=(ov.width-stageW*sc)/2, oy=(ov.height-stageH*sc)/2;
  og.save();
  try{
    og.translate(ox,oy); og.scale(sc,sc);
    og.beginPath(); og.rect(0,0,stageW,stageH); og.clip();
    for(const s of surfaceList){
      if(s.visible===false) continue;
      const M=mediaMap.get(s.id);
      const cur=(M && M.cur) ? M.store.get(M.cur) : null;
      if(!cur || !itemEl(cur, true)) drawPlaceholderTo(og, s);   // 'hold' is truthy — no flash
    }
    if(showOutlines) drawOutlinesTo(og, surfaceList, 2/sc);
  } finally { og.restore(); }
}

// ── Render loop (this tab drives itself) ──────────────────────────
function fit(){
  // ALL THREE canvases render at devicePixelRatio. The GL canvas always did;
  // the Canvas2D fallback and the overlay did not, so on a HiDPI screen the
  // calibration outlines and placeholders were visibly softer than the media
  // they are meant to be aligned against — the one job they have. draw2D and
  // drawOverlay derive their scale from the canvas dimensions, so they need no
  // other change. (On a typical 1:1 projector dpr is 1 and nothing changes.)
  const dpr=Math.max(1, window.devicePixelRatio||1);
  const w=Math.round(window.innerWidth*dpr), h=Math.round(window.innerHeight*dpr);
  oc.width=w;   oc.height=h;
  oc2d.width=w; oc2d.height=h;
  ov.width=w;   ov.height=h;
}
window.addEventListener('resize', fit);
fit();

let warned2D=false;
function frame(){
  const blendsOK = surfaceList.every(s => s.visible===false || GL_OK_BLENDS.has(s.blend||'normal'));
  const useGL = hasGL && blendsOK;
  oc.style.display   = useGL ? 'block' : 'none';
  oc2d.style.display = useGL ? 'none'  : 'block';
  if(hasGL && !useGL && !warned2D){
    warned2D=true;   // informational, local only — not an error
    const b=document.getElementById('banner');
    b.textContent='ℹ Overlay / Hard Light / Color Dodge blends use the compatibility renderer — expect lower FPS with several videos';
    b.style.display='block';
    setTimeout(()=>{ if(warned2D) clearBanner(); }, 6000);
  }
  try{
    tickPlaylists(performance.now());   // image items advance on their timer
    if(useGL) drawGL(); else draw2D();
    drawOverlay();
  }catch(err){ banner('Render hiccup (recovering)', err.message); }
  requestAnimationFrame(frame);
}
frame();

window.addEventListener('beforeunload', ()=>{ try{ bc.postMessage({type:'display-bye'}); }catch(_){} });

// Test hooks (read-only; used by tests/interaction.spec.js)
Object.defineProperty(window,'surfaceList',{get:()=>surfaceList});
Object.defineProperty(window,'mediaCount',{get:()=>[...mediaMap.values()].filter(M=>M.order.length>0).length});
Object.defineProperty(window,'stageSize',{get:()=>({w:stageW,h:stageH})});
Object.defineProperty(window,'glActive',{get:()=>hasGL});
// Test hook: evict a surface's blobs while leaving its playlist order intact —
// the shape of a real loss (pruned item revived by undo, or a dropped message).
window.__evict=(id)=>{
  const M=mediaMap.get(id); if(!M) return 0;
  const n=M.store.size;
  for(const it of M.store.values()) disposeItem(it);
  M.store.clear(); M.cur=null; M.nxt=null;
  if(M._missing) M._missing.clear();
  if(M._asked) M._asked.clear();
  return n;
};
Object.defineProperty(window,'_aliveSessions',{get:()=>_aliveSessions});
window.__setMemBudget=(n)=>{ MEM_BUDGET=n; };
Object.defineProperty(window,'_heldBytes',{get:()=>_heldBytes});
window.plState=(id)=>{
  const M=mediaMap.get(id);
  return M ? {order:[...M.order], cur:M.cur, nxt:M.nxt, transition:M.cfg.transition,
              items:M.store.size} : null;
};
</script>
