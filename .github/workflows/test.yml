# The two suites that need no hardware and no media files. Everything else —
# projector fullscreen, real codec playback, multi-GB storage — is in
# docs/TESTING.md, because it needs a real machine (see NOTES §2: automation
# flags change media behaviour, so a green CI run is not a substitute).
name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
